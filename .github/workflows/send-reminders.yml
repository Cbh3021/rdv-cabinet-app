name: Send appointment reminders

on:
  schedule:
    # Deux passages par jour, heure de Tunisie (UTC+1 toute l'année, pas de DST) :
    # - 07:00 (06:00 UTC) : passage principal (J-7, J-3, J-1, jour J)
    # - 13:00 (12:00 UTC) : second passage, uniquement pour rattraper le "jour J"
    #   (stage 2) d'un RDV pris ce matin même après le passage de 07h — sans lui
    #   le patient ne recevrait jamais ce rappel. L'idempotence (remindersSent)
    #   évite tout doublon pour les RDV déjà couverts par le passage de 07h.
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        working-directory: scripts
        run: npm install

      - name: Envoyer les rappels
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js
