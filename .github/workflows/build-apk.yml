name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer les dépendances npm
        run: npm install

      - name: Compiler le bundle JS de l'appli
        run: npx esbuild src/main.js --bundle --minify --format=iife --platform=browser --outfile=www/app.js

      - name: Synchroniser le projet Android
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: rdv-cabinet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk