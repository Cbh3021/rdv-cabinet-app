name: Réinitialisation des codes patients

# Tourne toutes les 5 min (le minimum autorisé par GitHub Actions ; le
# déclenchement réel peut être décalé de quelques minutes en période de
# forte charge sur GitHub — c'est le compromis du plan gratuit, voir la
# discussion avec le médecin), mais seulement 06h-21h UTC (= 07h-22h heure
# de Tunis) : personne ne demande de réinitialisation de code la nuit,
# inutile de consommer le quota Actions à ce moment. "workflow_dispatch"
# permet aussi de le lancer manuellement depuis l'onglet Actions du dépôt,
# sans attendre (utile si un patient en a besoin en pleine nuit malgré tout).
on:
  schedule:
    - cron: "*/5 6-21 * * *"
  workflow_dispatch: {}

jobs:
  reset-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer firebase-admin
        run: npm install firebase-admin

      - name: Traiter les demandes de réinitialisation en attente
        run: node scripts/reset-patient-codes.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
